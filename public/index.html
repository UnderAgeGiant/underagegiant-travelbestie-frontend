<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>TravelBestie</title>
    <script>
      (function () {
        var SUPPORTED = ['es-CL', 'en-US'];
        function fromCookie() {
          var m = document.cookie.match(/(?:^|;\s*)tb_locale=([^;]+)/);
          return m && SUPPORTED.indexOf(m[1]) !== -1 ? m[1] : null;
        }
        function fromStorage() {
          try {
            var v = localStorage.getItem('tb_locale');
            return SUPPORTED.indexOf(v) !== -1 ? v : null;
          } catch (e) { return null; }
        }
        function fromNavigator() {
          var lang = (navigator.language || '').toLowerCase();
          if (lang.indexOf('en') === 0) return 'en-US';
          if (lang.indexOf('es') === 0) return 'es-CL';
          return 'es-CL';
        }
        var locale = fromCookie() || fromStorage() || fromNavigator();
        // preserve any path/query/hash that landed on root (rare, but safe)
        var rest = (location.pathname === '/' ? '' : location.pathname) + location.search + location.hash;
        location.replace('/' + locale + '/' + rest.replace(/^\//, ''));
      })();
    </script>
  </head>
  <body></body>
</html>
