<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"></stop>
      <stop offset="100%" stop-color="#fde8d8"></stop>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"></stop>
      <stop offset="100%" stop-color="#EA580C"></stop>
    </linearGradient>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000018"></feDropShadow>
    </filter>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#bgGrad)" filter="url(#soft)"></circle>
  <circle cx="80" cy="80" r="74" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.35"></circle>
  <text x="32" y="104" font-family="Georgia, serif" font-size="82" font-weight="bold" font-style="italic" fill="#7C3AED" letter-spacing="-2">T</text>
  <text x="74" y="104" font-family="Georgia, serif" font-size="82" font-weight="bold" font-style="italic" fill="#EA580C" letter-spacing="-2">B</text>
